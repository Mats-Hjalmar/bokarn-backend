version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    lll:
      line-length: 80
  exclusions:
    rules:
      - path: _test\.go
        linters: [lll]

formatters:
  enable:
    - gofmt
    - goimports

version: v1.3.1

serve:
  public:
    base_url: http://auth.bokarn.localhost/
    cors:
      enabled: true
      allowed_origins:
        - http://api.bokarn.localhost
        - http://web.bokarn.localhost
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers: [Authorization, Content-Type, X-Session-Token]
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://web.bokarn.localhost/
  allowed_return_urls:
    - http://web.bokarn.localhost/
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        max_breaches: 0
        ignore_network_errors: true
        min_password_length: 8
    code:
      enabled: true
      config:
        lifespan: 24h
    link:
      enabled: false
    oidc:
      enabled: false
  flows:
    error:
      ui_url: http://web.bokarn.localhost/error
    registration:
      enabled: true
      ui_url: http://web.bokarn.localhost/registrera
    login:
      ui_url: http://web.bokarn.localhost/logga-in
      lifespan: 10m
    settings:
      ui_url: http://web.bokarn.localhost/installningar
      privileged_session_max_age: 15m
    logout:
      after:
        default_browser_return_url: http://web.bokarn.localhost/
    recovery:
      enabled: true
      use: code
      lifespan: 24h
      ui_url: http://web.bokarn.localhost/aterstall
    verification:
      enabled: false
      ui_url: http://web.bokarn.localhost/verifiera

# Invite and recovery redemption run server-side against API-type flows,
# because the frontends and Kratos sit on different sites and browsers no
# longer send a third-party session cookie back. This flag makes Kratos hand
# the session token to the caller in continue_with instead of answering a JSON
# submit with a browser redirect it cannot act on.
feature_flags:
  use_continue_with_transitions: true

log:
  level: info
  format: json
  leak_sensitive_values: false

# Placeholders. These are only ever valid for the local Docker stack; every
# deployed environment must supply its own through the environment.
secrets:
  cookie:
    - local-development-only-replace-in-every-deployment
  cipher:
    - "00000000000000000000000000000000"

ciphers:
  algorithm: xchacha20-poly1305

# Kratos only marks cookies Secure when its base URL is https, and browsers
# drop SameSite=None without Secure, so plain http local development stays Lax.
cookies:
  same_site: Lax

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

session:
  lifespan: 720h
